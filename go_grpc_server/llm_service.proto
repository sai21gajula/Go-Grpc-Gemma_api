syntax = "proto3";

package llm_service;

// go_package specifies the Go import path for the generated code
option go_package = "github.com/bharathgajula/go-grpc-gemma-api/pb;llmpb";

// LLM Service for text generation
service LLMService {
  // Unary RPC for standard text generation
  rpc GenerateText(GenerateRequest) returns (GenerateResponse);
  
  // Server-side streaming RPC for token-by-token generation
  rpc StreamGenerateText(GenerateRequest) returns (stream StreamGenerateResponse);
}

// Request message for text generation
message GenerateRequest {
  string prompt = 1;
  string model_id = 2;
  float temperature = 3;
  int32 max_new_tokens = 4;
}

// Response message for unary text generation
message GenerateResponse {
  string generated_text = 1;
}

// Response message for streaming text generation
message StreamGenerateResponse {
  string partial_text = 1;
  bool done = 2;
}
